name: coffea-multicell-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Coffea's Awkward-1 producer stack; MultiCell requires modern hist/boost-histogram.
  - python=3.11.15
  - numpy=1.23.5
  - coffea=0.7.21
  - awkward=1.10.3
  - uproot=4.3.7
  - hist=2.10.1
  - boost-histogram=1.7.2
  - numba=0.65.1
  - llvmlite=0.47.0
  - correctionlib=2.7.0
  - scipy=1.15.2
  # Artifact tests import plotting readers; newer Matplotlib requires newer NumPy.
  - matplotlib-base=3.10.8
  - mplhep=1.2.0
  - cloudpickle=3.1.2
  - pyyaml=6.0.3
  - pytest=9.1.1
  - pip
  - setuptools=70.3.0
  - wheel
  # Project remote-executor tooling; only local futures execution is validated.
  - ndcctools=7.17.1
  - conda-pack=0.9.2
