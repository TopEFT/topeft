STACKED_RATIO_STYLE:
  defaults:
    figure:
      figsize:
      - 10
      - 8
      height_ratios:
      - 4
      - 1
      hspace: 0.07
    cms:
      fontsize: 18.0
      overlap_margin: 0.01
    axes:
      label_fontsize: 18
      tick_labelsize: 18
      ratio_tick_labelsize: 18
      tick_width: 1.0
      tick_length: 4
      spine_width: 1.0
      y_offset: -0.07
      offset_fontsize: 18
      ratio_label: Ratio
      ratio_label_fontsize: 18
      ratio_label_margin: 0.002
      ticklabel_format:
        style: scientific
        scilimits:
        - 0
        - 6
        useMathText: true
      overflow_label: '>500'
      apply_secondary_ticks:
        x: true
        y: true
    legend:
      ncol: 5
      max_rows: 3
      fontsize: 16
      columnspacing: 0.8
      handletextpad: 0.6
      loc: upper center
      bbox_to_anchor:
      - 0.5
      - 1.0
      borderaxespad: 0.15
      top_margin_min: 0.01
      top_margin_scale: 0.25
      overlap_margin: 0.01
    uncertainty_legend:
      loc: upper right
      bbox_to_anchor:
      - 0.98
      - 0.98
      fontsize: 10
      ncol: 2
      columnspacing: 1.0
      frameon: false
    ratio_band_legend:
      loc: upper left
      fontsize: 10
      frameon: false
      ncol: 2
      columnspacing: 1.0
  per_region: {}
REGION_PLOTTING:
  CR:
    variable_label: Var name
    skip_sparse_2d: false
    channel_mode: aggregate
    skip_variables: []
    channel_transformations:
      default: []
      variables:
        njets:
        - njets
      conditional:
      - when: not_split_by_lepflav
        apply:
        - lepflav
    sample_removals:
    - categories:
        prefixes:
        - cr_2los_tt
        - cr_2los_Z
      groups:
      - Nonprompt
    category_skips:
    - categories:
        equals:
        - cr_2los_Z
      variable_includes:
      - j0
      variable_excludes:
      - lj0pt
    - categories:
        equals:
        - cr_2lss_flip
      variable_includes:
      - j0
      variable_excludes:
      - lj0pt
    sumw2_remove_signal: true
    sumw2_remove_signal_when_blinded: false
    debug_channel_lists: false
  SR:
    variable_label: Variable
    skip_sparse_2d: true
    channel_mode: per-channel
    skip_variables:
    - ptz
    - njets
    channel_transformations:
      default: []
      variables:
        njets:
        - njets
      conditional: []
    sample_removals: []
    category_skips: []
    sumw2_remove_signal: false
    sumw2_remove_signal_when_blinded: true
    debug_channel_lists: true
    analysis_bins:
      ptz: ptz
      lj0pt: lj0pt
